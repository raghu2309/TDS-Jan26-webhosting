name: Daily Auto-Commit (22f3001840@ds.study.iitm.ac.in)

on:
  schedule:
    - cron: '30 2 * * *'  # Runs daily at 2:30 AM UTC (specific hour/minute)
  workflow_dispatch:      # Allows manual trigger for testingg

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo  # Pulls your code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create commit by Raghu (22f3001840@ds.study.iitm.ac.in)
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)  # UTC ISO timestamp, always unique
          echo "# Daily Status Update" > status.md  # Markdown file, overwrites
          echo "## Run at: $DATE" >> status.md
          echo "- Automated by GitHub Actions" >> status.md
          echo "- Workflow ID: ${{ github.run_id }}" >> status.md
          git config user.name "Raghu Srinivasan"
          git config user.email "22f3001840@ds.study.iitm.ac.in"
          git add status.md
          git commit -m "Daily update: $DATE [skip ci]" || echo "No changes, but forcing"
          git push origin HEAD:$GITHUB_REF

